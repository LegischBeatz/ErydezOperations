name: erydez-operations

services:
  mongodb:
    image: mongo:7.0-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-erydez}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${DB_NAME:-erydez_operations}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME:-erydez}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongodb:27017/${DB_NAME:-erydez_operations}?authSource=admin&serverSelectionTimeoutMS=5000
      DB_NAME: ${DB_NAME:-erydez_operations}
      CORS_ORIGINS: ""
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=6)",
        ]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 10s
    networks:
      - app
      - data

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    ports:
      - "0.0.0.0:${ERYDEZ_PORT:-8082}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app

volumes:
  mongodb-data:

networks:
  app:
  data:
    internal: true
