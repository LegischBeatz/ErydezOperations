name: erydez-operations

services:
  mongodb:
    image: mongo:7.0-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-erydez}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${DB_NAME:-erydez_operations}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME:-erydez}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongodb:27017/${DB_NAME:-erydez_operations}?authSource=admin&serverSelectionTimeoutMS=5000
      DB_NAME: ${DB_NAME:-erydez_operations}
      ERYDEZ_LOCAL_OPERATOR_LABEL: ${ERYDEZ_LOCAL_OPERATOR_LABEL:-Local operator}
      INTEGRATION_HEALTH_RETENTION_DAYS: ${INTEGRATION_HEALTH_RETENTION_DAYS:-90}
      INTEGRATION_AUDIT_RETENTION_DAYS: ${INTEGRATION_AUDIT_RETENTION_DAYS:-365}
      GMAIL_SEND_OPERATION_RETENTION_HOURS: ${GMAIL_SEND_OPERATION_RETENTION_HOURS:-24}
      # Shopify client credentials stay in the local .env and are passed only to the backend.
      SHOPIFY_STORE_DOMAIN: ${SHOPIFY_STORE_DOMAIN:?Set SHOPIFY_STORE_DOMAIN in .env}
      SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION:-2025-10}
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:?Set SHOPIFY_CLIENT_ID in .env}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:?Set SHOPIFY_CLIENT_SECRET in .env}
      # Gmail OAuth secrets stay only in .env (never commit them). The redirect URI must match Google Cloud exactly.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GMAIL_OAUTH_REDIRECT_URI: ${GMAIL_OAUTH_REDIRECT_URI:-http://localhost:${ERYDEZ_PORT:-8082}/api/gmail/oauth/callback}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${GMAIL_TOKEN_ENCRYPTION_KEY:-}
      # The AI key is optional for mailbox access; it is required only for answer drafts.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      GMAIL_AI_MODEL: ${GMAIL_AI_MODEL:-gpt-5-mini}
      CORS_ORIGINS: ""
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=6)",
        ]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 10s
    networks:
      - app
      - data

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ERYDEZ_PORT:-8082}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app

volumes:
  mongodb-data:

networks:
  app:
  data:
    internal: true
